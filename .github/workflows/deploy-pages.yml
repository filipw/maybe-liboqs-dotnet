name: Deploy website to GitHub Pages

# Publishes the static site in ./website to GitHub Pages.
#
# One-time setup required in the repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# This cannot be configured from the workflow file itself.

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow the workflow to publish a Pages deployment using OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel older queued runs in favour of the latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
